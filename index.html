<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Analytix — Website Intelligence Portal</title>
  <meta name="description" content="Enterprise website monitoring, SEO intelligence, performance analytics, and AI-powered website management platform for web teams."/>
  <meta name="robots" content="noindex"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="css/main.css"/>
</head>
<body>

<div id="app" class="app-layout">

  <!-- ═══════════════════════════════════════════ SIDEBAR ══ -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark">✦</div>
      <div class="logo-text">
        <span class="logo-name">Analytix</span>
        <span class="logo-tagline">Website Intelligence</span>
      </div>
    </div>

    <div class="sidebar-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" placeholder="Search..." id="sidebar-search-input"/>
    </div>

    <nav class="sidebar-nav" id="sidebar-nav">
      <!-- Populated by app.js -->
    </nav>

    <div class="sidebar-user">
      <div class="user-avatar-wrap">
        <div class="user-avatar">A</div>
        <span class="user-status-dot"></span>
      </div>
      <div class="user-meta">
        <span class="user-name">Admin User</span>
        <span class="user-role">Super Admin</span>
      </div>
      <button class="icon-btn user-menu-btn" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93A10 10 0 0 0 4.93 19.07M4.93 4.93a10 10 0 0 0 14.14 14.14"/></svg>
      </button>
    </div>
  </aside>

  <!-- ══════════════════════════════════════════ MAIN AREA ══ -->
  <div class="main-area" id="main-area">

    <!-- TOP BAR -->
    <header class="topbar" id="topbar">
      <div class="topbar-left">
        <button id="sidebar-toggle" class="icon-btn sidebar-toggle-btn" title="Toggle Sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb">
          <span>Dashboard</span>
        </nav>
      </div>
      <div class="topbar-center">
        <div class="topbar-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" placeholder="Search websites, issues, domains…" id="global-search" autocomplete="off"/>
          <div class="search-results" id="search-results"></div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="topbar-date">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span id="current-date"></span>
        </div>
        <button class="icon-btn notif-btn" id="notif-btn" title="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="notif-badge" id="notif-badge">7</span>
        </button>
        <button class="btn btn-sm btn-primary" id="daily-brief-btn" title="Generate AI Daily Brief">
          <span class="btn-icon">✦</span> Daily Brief
        </button>
      </div>
    </header>

    <!-- PAGE CONTENT -->
    <main class="page-content" id="page-content" role="main">
      <div class="page-loader" id="page-loader">
        <div class="loader-spinner"></div>
        <span>Loading...</span>
      </div>
    </main>

  </div><!-- /main-area -->
</div><!-- /app -->

<!-- ══════════════════════════════════════ FLOATING AI BUTTON ══ -->
<div id="ai-fab" class="ai-fab" role="button" aria-label="Open Analytix AI Assistant" tabindex="0">
  <div class="ai-fab-glow"></div>
  <div class="ai-fab-content">
    <span class="ai-fab-icon">✦</span>
    <span class="ai-fab-label">Analytix AI</span>
  </div>
</div>

<!-- ══════════════════════════════════════════ AI CHAT PANEL ══ -->
<div id="ai-panel" class="ai-panel" role="dialog" aria-label="Analytix AI Assistant" aria-hidden="true">
  <div class="ai-panel-header">
    <div class="ai-panel-title">
      <span class="ai-star">✦</span>
      <div>
        <div class="ai-title-text">Analytix AI</div>
        <div class="ai-subtitle">Your website intelligence assistant</div>
      </div>
    </div>
    <div class="ai-panel-actions">
      <button class="icon-btn ai-action-btn" id="ai-new-chat" title="New Conversation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="icon-btn ai-action-btn" id="ai-history-btn" title="Conversation History">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg>
      </button>
      <button class="icon-btn ai-action-btn" id="ai-fullscreen-btn" title="Full Screen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
      <button class="icon-btn ai-action-btn" id="ai-clear-btn" title="Clear Conversation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
      </button>
      <button class="icon-btn ai-action-btn ai-close-btn" id="ai-close-btn" title="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>

  <div class="ai-messages" id="ai-messages">
    <!-- Populated by AI service -->
  </div>

  <div class="ai-suggestions" id="ai-suggestions">
    <div class="suggestion-label">Suggested questions:</div>
    <div class="suggestion-chips" id="suggestion-chips">
      <!-- Populated by AI service -->
    </div>
  </div>

  <div class="ai-input-area">
    <div class="ai-input-wrap">
      <textarea id="ai-input" class="ai-input" placeholder="Ask about your websites, SEO, performance, domains, plugins…" rows="1"></textarea>
      <div class="ai-input-actions">
        <button class="icon-btn ai-attach-btn" title="Attach Report">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <button class="icon-btn ai-analyze-btn" id="ai-analyze-btn" title="Run Analysis">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        </button>
        <button class="btn btn-primary ai-send-btn" id="ai-send-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          Send
        </button>
      </div>
    </div>
    <div class="ai-input-footer">
      <span class="ai-context-label" id="ai-context-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Context: <span id="ai-context-value">Dashboard</span>
      </span>
      <span class="ai-disclaimer">AI uses portal data only · No hallucination</span>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════ NOTIFICATION PANEL ══ -->
<div id="notif-panel" class="notif-panel" aria-hidden="true">
  <div class="notif-panel-header">
    <span>Notifications</span>
    <button class="text-btn" id="mark-all-read">Mark all read</button>
  </div>
  <div class="notif-list" id="notif-list"></div>
</div>

<!-- ══════════════════════════════════════════ TOAST AREA ══ -->
<div id="toast-container" class="toast-container" aria-live="polite"></div>

<!-- ═════════════════════════════════════════════ MODAL ══ -->
<div id="modal-overlay" class="modal-overlay" aria-hidden="true">
  <div class="modal" id="modal" role="dialog">
    <div class="modal-header">
      <h3 class="modal-title" id="modal-title"></h3>
      <button class="icon-btn modal-close" id="modal-close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
